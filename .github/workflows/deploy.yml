name: Deploy to Coolify

# Deployment itself is handled natively by Coolify's own GitHub webhook
# (push -> master triggers an auto-deploy independent of this workflow;
# see repo webhook config in GitHub Settings -> Webhooks). This workflow
# only enforces that CI passes on the ref Coolify is about to build, and
# runs on GitHub-hosted infrastructure since this repo is public.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require the master release ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Production deploys require refs/heads/master; got $GITHUB_REF."
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml
