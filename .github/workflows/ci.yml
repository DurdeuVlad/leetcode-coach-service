name: CI

# Branch model: `dev` is the integration branch (external PRs target it).
# `master` is the release branch — only the maintainer merges dev -> master,
# and only `master` deploys to the homelab. CI runs on:
#   - any PR targeting dev (external contributors + maintainer's own PRs)
#   - any push to dev (catch breakage before merge-to-master)
#   - any push to master (runs before the deploy job in deploy.yml)
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: leetcode_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/leetcode_coach_test
      # Tests that need integrations use respx mocks; no real keys in CI.
      TELEGRAM_BOT_TOKEN: test-token
      OPENAI_API_KEY: test-key
      GEMINI_API_KEY: test-key
      TELEGRAM_CHAT_ID: "123456"
      LEETCODE_USERNAME: test-user
      # Google Tasks — required by Settings() at import time; test placeholders.
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REFRESH_TOKEN: test-refresh-token
      GOOGLE_TASKS_LIST_ID: test-task-list-id
      TIMEZONE: Europe/Bucharest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (dev extras)
        run: uv sync --extra dev --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run migrations against test DB
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -q
