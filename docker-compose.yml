# Local development: app + postgres.
# The app runs the scheduler in-process (single container).
# For local dev you usually run uvicorn on the host with --reload; the `app`
# service here is for a full container-based smoke test (and mirrors Coolify).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode
      POSTGRES_DB: leetcode_coach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcode -d leetcode_coach"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://leetcode:leetcode@postgres:5432/leetcode_coach
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in .env}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      TERRA_MODEL: ${TERRA_MODEL:-gpt-5.6-terra}
      SOL_ADVISOR_MODEL: ${SOL_ADVISOR_MODEL:-gpt-5.6-sol}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-8}
      APPROVAL_TTL_HOURS: ${APPROVAL_TTL_HOURS:-24}
      PROMPT_CACHE_TTL: ${PROMPT_CACHE_TTL:-30m}
      LEETCODE_USERNAME: ${LEETCODE_USERNAME:-}
      BROWSERLESS_URL: ${BROWSERLESS_URL:-}
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-}
      TIMEZONE: ${TIMEZONE:-Europe/Bucharest}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
